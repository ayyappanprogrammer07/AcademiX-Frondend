<div class="page-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="logo-mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#7C3AED"/>
          <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="formgroup" (ngSubmit)="signin()">


      <!-- Username -->
      <div class="field-group" >
        <label class="label" for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            id="username"
            name="username"
            type="text"
            class="input"
            placeholder="Enter your username"
            formControlName="username"
          />
        </div>
      </div>

      <!-- User Type -->
      <div class="field-group" style="margin-top: 20px;">
        <label class="label" for="usertype">User Type</label>
        <div class="input-wrapper select-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
          </span>
          <select
            id="usertype"
            name="usertype"
            class="input select"
            formControlName="usertype"
    
          >
            <option value="" disabled selected>Select user type</option>
            <option value="admin">Admin</option>
            <option value="manager">Staff</option>
            <option value="viewer">Students</option>
          </select>
          <span class="select-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>
        
      </div>

      <!-- Password -->
      <div class="field-group"  style="margin-top: 20px;" >
        <label class="label" for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="input"
            placeholder="Enter your password"
            formControlName="password"
          />
          <button type="button" class="toggle-btn" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-row"  style="margin-top: 20px;">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn"  style="margin-top: 20px;" >
        <span (click)="signin()">Sign In</span>
      </button>
    </form>
  </div>
</div>
